<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apna DG Store - Admin Control Center</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Supabase JS Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans pb-24">

    <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="p-2 bg-brand-600 rounded-xl text-lg">⚡</span>
                <div>
                    <h1 class="font-black text-base leading-none">Apna DG Store <span class="text-brand-500">Admin</span></h1>
                    <p class="text-[10px] text-slate-400">Management Panel</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">

        <!-- SECTION: PURCHASES & SUPPLIERS -->
        <section id="tab-purchases" class="space-y-8">
            <div>
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h2 class="text-xl font-black text-slate-900">Supplier Management</h2>
                        <p class="text-xs text-slate-500">Manage suppliers and contacts from DB.</p>
                    </div>
                    <button onclick="openSupplierModal()" class="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold hover:bg-slate-800">+ Add Supplier</button>
                </div>
                <div id="suppliers-grid" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <!-- Dynamic Suppliers From DB -->
                </div>
            </div>

            <hr class="border-slate-200">

            <div>
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-black text-slate-900">Purchase Orders History</h3>
                    <button onclick="loadPurchaseOrdersHistory()" class="px-3 py-1.5 bg-brand-600 text-white text-xs font-bold rounded-xl">🔄 Refresh DB Data</button>
                </div>
                <div class="bg-white border border-slate-200 rounded-3xl overflow-hidden shadow-sm">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-50 text-slate-500 font-bold border-b border-slate-200">
                            <tr><th class="p-4">PO ID</th><th class="p-4">Supplier Name</th><th class="p-4">Amount</th><th class="p-4">Status</th><th class="p-4">Date</th></tr>
                        </thead>
                        <tbody id="po-history-table" class="divide-y divide-slate-100">
                            <!-- Dynamic POs From DB -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <!-- SUPPLIER MODAL -->
    <div id="supplier-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl relative">
            <button onclick="closeSupplierModal()" class="absolute top-4 right-4 text-slate-400">✕</button>
            <h3 class="text-lg font-black mb-4">Add New Supplier</h3>
            <form onsubmit="saveSupplier(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Supplier Name</label>
                    <input type="text" id="sup-name" required class="w-full bg-slate-50 border rounded-xl p-2 text-xs outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Phone Number</label>
                    <input type="tel" id="sup-phone" required class="w-full bg-slate-50 border rounded-xl p-2 text-xs outline-none">
                </div>
                <button type="submit" class="w-full py-3 bg-slate-900 text-white font-bold rounded-xl text-xs mt-2">Save Supplier</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://xbzvnhhyataeciiysbhh.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_aevPjOJgExRRlhUA9-iAYg_tpIk03it";
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener("DOMContentLoaded", () => {
            loadSuppliers();
            loadPurchaseOrdersHistory();
        });

        async function loadSuppliers() {
            const grid = document.getElementById('suppliers-grid');
            grid.innerHTML = '<div class="col-span-3 text-xs text-slate-400">Loading suppliers...</div>';

            const { data, error } = await db.from('suppliers').select('*').order('name');
            if (error || !data || data.length === 0) {
                grid.innerHTML = '<div class="col-span-3 text-xs text-slate-400">No suppliers found in DB.</div>';
                return;
            }

            grid.innerHTML = data.map(s => `
                <div class="bg-white p-4 rounded-2xl border border-slate-200 flex items-center justify-between">
                    <div>
                        <h4 class="font-bold text-sm text-slate-900">${s.name}</h4>
                        <p class="text-xs text-slate-500">${s.phone || 'N/A'}</p>
                    </div>
                </div>
            `).join('');
        }

        async function loadPurchaseOrdersHistory() {
            const table = document.getElementById('po-history-table');
            table.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">Loading DB data...</td></tr>`;

            const { data, error } = await db.from('purchase_orders').select('*').order('created_at', { ascending: false });

            if (error || !data || data.length === 0) {
                table.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">No POs found in DB.</td></tr>`;
                return;
            }

            table.innerHTML = data.map(po => `
                <tr>
                    <td class="p-4 font-mono font-bold">${po.po_number || po.po_id || po.id}</td>
                    <td class="p-4 font-medium">${po.supplier_name || 'N/A'}</td>
                    <td class="p-4 font-black">₹${Number(po.total_amount || 0).toFixed(2)}</td>
                    <td class="p-4"><span class="px-2 py-1 rounded-lg text-[10px] font-bold uppercase bg-amber-100 text-amber-800">${po.status || 'pending'}</span></td>
                    <td class="p-4 text-slate-400">${po.created_at ? new Date(po.created_at).toLocaleDateString('hi-IN') : '-'}</td>
                </tr>
            `).join('');
        }

        function openSupplierModal() { document.getElementById('supplier-modal').classList.remove('hidden'); }
        function closeSupplierModal() { document.getElementById('supplier-modal').classList.add('hidden'); }

        async function saveSupplier(e) {
            e.preventDefault();
            const name = document.getElementById('sup-name').value;
            const phone = document.getElementById('sup-phone').value;

            const { error } = await db.from('suppliers').insert([{ name, phone }]);
            if (error) alert('Error adding supplier: ' + error.message);
            else {
                alert('Supplier saved!');
                closeSupplierModal();
                loadSuppliers();
            }
        }
    </script>
</body>
</html>
