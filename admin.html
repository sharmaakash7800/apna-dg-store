<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Apna DG Store - Admin Dashboard</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --success: #10b981;
      --danger: #ef4444;
      --blue: #3b82f6;

      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(15,23,42,0.06);
      --shadow-lg: 0 10px 25px rgba(15,23,42,0.08);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-dark);
      background: var(--bg);
      padding-bottom: 90px;
    }

    header {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text-dark);
      padding: 14px 24px;
      position: sticky;
      top: 0;
      z-index: 90;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-sm);
    }

    .header-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 16px; 
      left: 50%;
      transform: translateX(-50%);
      width: min(92%, 520px);
      height: 64px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 32px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
      box-shadow: var(--shadow-lg);
      padding: 0 8px;
    }

    .bottom-nav-btn {
      flex: 1;
      height: 48px;
      background: transparent;
      border: 0;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .bottom-nav-btn .icon { font-size: 18px; transition: transform 0.2s ease; }
    .bottom-nav-btn:hover { color: var(--primary); }

    .bottom-nav-btn.active {
      color: var(--primary);
      background: rgba(79, 70, 229, 0.08);
      font-weight: 700;
    }

    .bottom-nav-btn.active .icon { transform: scale(1.15); }

    .container { width: min(100%, 1150px); padding: 20px 16px; margin: auto; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card {
      background: var(--surface);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
    }

    .card h2, .card h3 { margin: 0 0 14px 0; font-size: 15px; font-weight: 700; color: var(--text-dark); }

    .form-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }

    @media (min-width: 600px) {
      .form-grid { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    }

    input, select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 13px;
      outline: none;
      background: #f8fafc;
      color: var(--text-dark);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .btn-primary, .btn-green, .btn-danger, .btn-outline {
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
      width: auto;
    }

    .btn-primary { background: linear-gradient(135deg, #4f46e5, #4338ca); color: white; }
    .btn-green { background: linear-gradient(135deg, #10b981, #059669); color: white; }
    .btn-danger { background: #fee2e2; color: var(--danger); font-size: 11px; padding: 6px 12px; border-radius: 8px; font-weight: 700; }

    .table-responsive { overflow-x: auto; max-height: 420px; border-radius: 12px; border: 1px solid var(--border); }
    .custom-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .custom-table th, .custom-table td { border-bottom: 1px solid var(--border); padding: 10px 12px; text-align: left; }
    .custom-table th { background: #f8fafc; position: sticky; top: 0; z-index: 10; font-weight: 700; color: var(--text-muted); }

    .chk-box { width: 16px; height: 16px; cursor: pointer; accent-color: var(--primary); }

    .btn-status-active { background: #d1fae5; color: #047857; border: 1px solid #6ee7b7; padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer; }
    .btn-status-inactive { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="header-title">⚙️ Apna DG Store Admin</div>
  </header>

  <nav class="bottom-nav">
    <button id="nav-customerTab" class="bottom-nav-btn active" onclick="switchTab('customerTab', this)">
      <span class="icon">📋</span>
      <span>Customer Orders</span>
    </button>
    <button id="nav-supplierTab" class="bottom-nav-btn" onclick="switchTab('supplierTab', this)">
      <span class="icon">🏬</span>
      <span>My Purchases</span>
    </button>
    <button id="nav-productsTab" class="bottom-nav-btn" onclick="switchTab('productsTab', this)">
      <span class="icon">📦</span>
      <span>Products Master</span>
    </button>
    <button id="nav-reportsTab" class="bottom-nav-btn" onclick="switchTab('reportsTab', this)">
      <span class="icon">📊</span>
      <span>Sales Reports</span>
    </button>
  </nav>

  <div class="container">

    <!-- TAB 3: PRODUCTS MASTER TABLE (WITH VISIBILITY CONTROL) -->
    <section id="productsTab" class="tab-content">
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px;">
          <h2 style="margin:0;">📦 Products Master List (<span id="totalProductsCount">0</span>)</h2>
          <button class="btn-primary" onclick="loadAllProductsView()" style="padding:6px 12px; font-size:11px;">🔄 Refresh Table</button>
        </div>

        <div style="margin-bottom: 10px;">
          <input type="text" id="adminProductSearchInput" placeholder="🔍 Search product..." oninput="renderProductsTable()" />
        </div>

        <div class="table-responsive">
          <table class="custom-table">
            <thead>
              <tr>
                <th style="width:30px; text-align:center;">Select</th>
                <th>ID</th>
                <th>Item Name</th>
                <th>Category</th>
                <th>Stock Qty</th>
                <th>Selling Price (₹)</th>
                <th>Status (Customer App)</th>
              </tr>
            </thead>
            <tbody id="productsTableBody">
              <tr><td colspan="7" style="text-align:center; color:var(--text-muted);">Products load ho rahe hain...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://xbzvnhhyataeciiysbhh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_aevPjOJgExRRlhUA9-iAYg_tpIk03it";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let productsList = [];

    async function loadAllProductsView() {
      const tbody = document.getElementById("productsTableBody");
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:var(--text-muted);">Products load ho rahe hain...</td></tr>';
      
      const { data, error } = await db.from("products").select("*").order("name");
      if (error) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--danger);">Error: ${error.message}</td></tr>`;
        return;
      }

      productsList = data || [];
      document.getElementById("totalProductsCount").textContent = productsList.length;
      renderProductsTable();
    }

    function renderProductsTable() {
      const tbody = document.getElementById("productsTableBody");
      const searchVal = document.getElementById("adminProductSearchInput").value.toLowerCase().trim();

      const filtered = productsList.filter(p => 
        String(p.id).toLowerCase().includes(searchVal) ||
        String(p.name || '').toLowerCase().includes(searchVal) ||
        String(p.category || '').toLowerCase().includes(searchVal)
      );

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:var(--text-muted);">Koi product nahi mila.</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(p => {
        const isActive = p.active !== false; // Default true
        return `
          <tr>
            <td style="text-align:center;"><input type="checkbox" class="chk-box" /></td>
            <td><strong>${p.id}</strong></td>
            <td>${p.name || 'N/A'}</td>
            <td>${p.category || 'N/A'}</td>
            <td>${p.stock_qty || 0}</td>
            <td style="color:var(--success); font-weight:bold;">₹${Number(p.selling_price || p.price || 0).toFixed(2)}</td>
            <td>
              <button class="${isActive ? 'btn-status-active' : 'btn-status-inactive'}" onclick="toggleProductVisibility('${p.id}', ${isActive})">
                ${isActive ? '👁️ VISIBLE (True)' : '🙈 HIDDEN (False)'}
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    /* DIRECT TOGGLE VISIBILITY FROM ADMIN PANEL */
    async function toggleProductVisibility(productId, currentStatus) {
      const newStatus = !currentStatus;
      
      const { error } = await db.from("products").update({ active: newStatus }).eq("id", productId);
      
      if (error) {
        alert("Status update karne me error aaya: " + error.message);
      } else {
        const prod = productsList.find(p => String(p.id) === String(productId));
        if (prod) prod.active = newStatus;
        renderProductsTable();
      }
    }

    loadAllProductsView();
  </script>
</body>
</html>
