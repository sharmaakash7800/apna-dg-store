<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Apna DG Store</title>

  <style>
    :root {
      --navy: #0f172a;
      --navy-2: #1e293b;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --yellow: #f59e0b;
      --green: #16a34a;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #111827;
      --muted: #64748b;
      --danger: #dc2626;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    button, input, select, textarea { font: inherit; }

    .top-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--navy);
      color: white;
      box-shadow: 0 3px 14px rgba(0,0,0,.2);
    }

    .top-row {
      width: min(1440px, 96%);
      margin: auto;
      min-height: 70px;
      display: grid;
      grid-template-columns: auto minmax(260px, 1fr) auto;
      gap: 18px;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #f59e0b, #f97316);
      font-size: 23px;
    }

    .brand h1 {
      margin: 0;
      font-size: 22px;
    }

    .brand small {
      display: block;
      color: #cbd5e1;
      font-size: 11px;
    }

    .search-wrap {
      display: grid;
      grid-template-columns: 150px 1fr 54px;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    .search-wrap select,
    .search-wrap input {
      border: 0;
      outline: 0;
      min-height: 46px;
      background: white;
    }

    .search-wrap select {
      padding: 0 12px;
      border-right: 1px solid var(--border);
      color: #334155;
    }

    .search-wrap input {
      padding: 0 14px;
      min-width: 0;
    }

    .search-btn {
      border: 0;
      cursor: pointer;
      background: var(--yellow);
      font-size: 20px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-action {
      color: white;
      text-decoration: none;
      font-size: 13px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .header-action strong {
      display: block;
      font-size: 15px;
    }

    .cart-button {
      border: 0;
      cursor: pointer;
      border-radius: 10px;
      padding: 10px 14px;
      background: #fff;
      color: var(--navy);
      font-weight: 800;
      white-space: nowrap;
    }

    .category-bar {
      background: var(--navy-2);
      overflow-x: auto;
    }

    .category-list {
      width: min(1440px, 96%);
      margin: auto;
      display: flex;
      gap: 8px;
      padding: 10px 0;
      min-width: max-content;
    }

    .category-chip {
      border: 0;
      cursor: pointer;
      border-radius: 999px;
      padding: 8px 14px;
      background: #334155;
      color: white;
      font-size: 13px;
      transition: .2s;
    }

    .category-chip:hover,
    .category-chip.active {
      background: var(--yellow);
      color: #111827;
    }

    .hero {
      width: min(1440px, 96%);
      margin: 18px auto;
      min-height: 220px;
      border-radius: 18px;
      padding: 34px;
      display: flex;
      align-items: center;
      background:
        linear-gradient(90deg, rgba(15,23,42,.92), rgba(37,99,235,.78)),
        radial-gradient(circle at right, rgba(245,158,11,.45), transparent 40%);
      color: white;
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    .hero::after {
      content: "🛒";
      position: absolute;
      right: 8%;
      font-size: 120px;
      opacity: .16;
    }

    .hero h2 {
      max-width: 700px;
      margin: 0 0 10px;
      font-size: clamp(30px, 5vw, 52px);
      line-height: 1.05;
    }

    .hero p {
      max-width: 650px;
      margin: 0;
      color: #dbeafe;
      font-size: 16px;
    }

    .layout {
      width: min(1440px, 96%);
      margin: 0 auto 50px;
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr) 360px;
      gap: 18px;
      align-items: start;
    }

    .card {
      background: var(--surface);
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .sidebar {
      position: sticky;
      top: 125px;
      padding: 18px;
    }

    .sidebar h3 {
      margin: 0 0 14px;
      font-size: 18px;
    }

    .sidebar label {
      display: block;
      margin: 10px 0 6px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }

    .sidebar select,
    .sidebar input {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 0 10px;
      outline: 0;
    }

    .product-section {
      min-width: 0;
    }

    .toolbar {
      padding: 16px 18px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
    }

    .toolbar h2 {
      margin: 0;
      font-size: 22px;
    }

    .toolbar span {
      color: var(--muted);
      font-size: 13px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 14px;
    }

    .product {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 350px;
      transition: transform .2s, box-shadow .2s;
    }

    .product:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 30px rgba(15,23,42,.13);
    }

    .product-visual {
      min-height: 150px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #eff6ff, #fff7ed);
      font-size: 58px;
      position: relative;
    }

    .discount-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--danger);
      color: white;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 800;
    }

    .product-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .product h3 {
      margin: 0;
      font-size: 16px;
      line-height: 1.35;
      min-height: 44px;
    }

    .rating {
      color: var(--yellow);
      font-size: 13px;
    }

    .category-text,
    .sku {
      color: var(--muted);
      font-size: 12px;
    }

    .price {
      margin-top: auto;
      font-size: 22px;
      font-weight: 900;
    }

    .add-btn {
      width: 100%;
      border: 0;
      cursor: pointer;
      border-radius: 9px;
      padding: 11px 12px;
      background: var(--yellow);
      color: #111827;
      font-weight: 800;
    }

    .add-btn:hover {
      background: #fbbf24;
    }

    .cart-panel {
      position: sticky;
      top: 125px;
      padding: 18px;
      max-height: calc(100vh - 145px);
      overflow: auto;
    }

    .cart-panel h2 {
      margin-top: 0;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .qty-controls button {
      width: 30px;
      height: 30px;
      border: 0;
      cursor: pointer;
      border-radius: 8px;
      background: #e2e8f0;
      font-weight: 800;
    }

    .remove-btn {
      margin-top: 5px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--danger);
      cursor: pointer;
      font-weight: 700;
      font-size: 12px;
    }

    .total {
      display: flex;
      justify-content: space-between;
      margin: 18px 0;
      padding-top: 14px;
      border-top: 2px solid var(--border);
      font-size: 21px;
      font-weight: 900;
    }

    .form-grid {
      display: grid;
      gap: 10px;
    }

    .form-grid input,
    .form-grid textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 11px 12px;
      outline: 0;
    }

    .form-grid textarea {
      min-height: 90px;
      resize: vertical;
    }

    .place-btn {
      width: 100%;
      margin-top: 12px;
      border: 0;
      cursor: pointer;
      border-radius: 10px;
      padding: 13px;
      color: white;
      background: var(--blue);
      font-weight: 800;
    }

    .place-btn:hover { background: var(--blue-dark); }
    .place-btn:disabled { opacity: .6; cursor: not-allowed; }

    .message {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.45;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 30px;
      text-align: center;
      color: var(--muted);
      background: white;
      border-radius: 14px;
      border: 1px dashed var(--border);
    }

    .loading {
      grid-column: 1 / -1;
      padding: 50px;
      text-align: center;
      color: var(--muted);
      background: white;
      border-radius: 14px;
    }

    @media (max-width: 1180px) {
      .layout {
        grid-template-columns: 220px minmax(0, 1fr);
      }

      .cart-panel {
        grid-column: 1 / -1;
        position: static;
        max-height: none;
      }
    }

    @media (max-width: 820px) {
      .top-row {
        grid-template-columns: 1fr auto;
      }

      .search-wrap {
        grid-column: 1 / -1;
        order: 3;
        margin-bottom: 12px;
      }

      .header-actions .header-action {
        display: none;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
      }

      .hero {
        min-height: 180px;
        padding: 24px;
      }
    }

    @media (max-width: 560px) {
      .top-row {
        width: 94%;
      }

      .search-wrap {
        grid-template-columns: 110px 1fr 48px;
      }

      .brand small { display: none; }

      .hero {
        width: 94%;
      }

      .layout {
        width: 94%;
      }

      .products {
        grid-template-columns: 1fr 1fr;
      }

      .product {
        min-height: 320px;
      }

      .product-visual {
        min-height: 120px;
        font-size: 44px;
      }
    }
  </style>
</head>

<body>
  <header class="top-header">
    <div class="top-row">
      <div class="brand">
        <div class="brand-logo">🛒</div>
        <div>
          <h1>Apna DG Store</h1>
          <small>Sab kuch, ek jagah</small>
        </div>
      </div>

      <div class="search-wrap">
        <select id="topCategoryFilter">
          <option value="">All</option>
        </select>
        <input id="productSearch" type="search" placeholder="Search products by name or SKU..." />
        <button class="search-btn" type="button">🔍</button>
      </div>

      <div class="header-actions">
        <a class="header-action" href="#productsArea">
          Hello, Customer
          <strong>Your Account</strong>
        </a>
        <button class="cart-button" type="button">
          🛍 Cart <span id="cartCount">0</span>
        </button>
      </div>
    </div>

    <div class="category-bar">
      <div id="categoryChips" class="category-list"></div>
    </div>
  </header>

  <section class="hero">
    <div>
      <h2>Daily essentials, ab online order karein</h2>
      <p>Products search karein, category choose karein aur ek hi order mein multiple items add karein.</p>
    </div>
  </section>

  <main id="productsArea" class="layout">
    <aside class="card sidebar">
      <h3>Filters</h3>

      <label for="sideCategoryFilter">Category</label>
      <select id="sideCategoryFilter">
        <option value="">All Categories</option>
      </select>

      <label for="sortProducts">Sort By</label>
      <select id="sortProducts">
        <option value="name-asc">Name: A to Z</option>
        <option value="name-desc">Name: Z to A</option>
        <option value="price-low">Price: Low to High</option>
        <option value="price-high">Price: High to Low</option>
      </select>
    </aside>

    <section class="product-section">
      <div class="card toolbar">
        <div>
          <h2>Products</h2>
          <span id="resultCount"></span>
        </div>
      </div>

      <div id="products" class="products">
        <div class="loading">Products load ho rahe hain...</div>
      </div>
    </section>

    <aside class="card cart-panel">
      <h2>Your Cart</h2>

      <div id="cart"></div>

      <div class="total">
        <span>Total</span>
        <span>₹<span id="grandTotal">0.00</span></span>
      </div>

      <h3>Customer Details</h3>

      <form id="orderForm">
        <div class="form-grid">
          <input id="customerName" type="text" placeholder="Customer name" required />
          <input id="mobile" type="tel" placeholder="Mobile number" minlength="10" required />
          <textarea id="address" placeholder="Delivery address" required></textarea>
        </div>

        <button id="placeOrderBtn" class="place-btn" type="submit">
          Place Order
        </button>
      </form>

      <div id="message" class="message"></div>
    </aside>
  </main>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://xbzvnhhyataeciiysbhh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_aevPjOJgExRRlhUA9-iAYg_tpIk03it";

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let products = [];
    let cart = [];
    let selectedCategory = "";

    const productsEl = document.getElementById("products");
    const productSearchEl = document.getElementById("productSearch");
    const topCategoryFilterEl = document.getElementById("topCategoryFilter");
    const sideCategoryFilterEl = document.getElementById("sideCategoryFilter");
    const sortProductsEl = document.getElementById("sortProducts");
    const categoryChipsEl = document.getElementById("categoryChips");
    const resultCountEl = document.getElementById("resultCount");
    const cartEl = document.getElementById("cart");
    const cartCountEl = document.getElementById("cartCount");
    const grandTotalEl = document.getElementById("grandTotal");
    const messageEl = document.getElementById("message");
    const placeOrderBtn = document.getElementById("placeOrderBtn");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = "message " + type;
    }

    function fillCategories() {
      const categories = [...new Set(
        products
          .map(product => String(product.category || "").trim())
          .filter(Boolean)
      )].sort((a, b) => a.localeCompare(b));

      const options =
        '<option value="">All Categories</option>' +
        categories.map(category =>
          `<option value="${escapeHtml(category)}">${escapeHtml(category)}</option>`
        ).join("");

      topCategoryFilterEl.innerHTML =
        '<option value="">All</option>' +
        categories.map(category =>
          `<option value="${escapeHtml(category)}">${escapeHtml(category)}</option>`
        ).join("");

      sideCategoryFilterEl.innerHTML = options;

      categoryChipsEl.innerHTML =
        `<button class="category-chip active" data-category="">All Categories</button>` +
        categories.slice(0, 14).map(category =>
          `<button class="category-chip" data-category="${escapeHtml(category)}">${escapeHtml(category)}</button>`
        ).join("");

      categoryChipsEl.querySelectorAll(".category-chip").forEach(button => {
        button.addEventListener("click", () => {
          selectedCategory = button.dataset.category;
          topCategoryFilterEl.value = selectedCategory;
          sideCategoryFilterEl.value = selectedCategory;

          categoryChipsEl.querySelectorAll(".category-chip").forEach(chip => {
            chip.classList.toggle("active", chip === button);
          });

          renderProducts();
        });
      });
    }

    function renderProducts() {
      const search = productSearchEl.value.trim().toLowerCase();

      let filtered = products.filter(product => {
        const name = String(product.name || "").toLowerCase();
        const sku = String(product.id || "").toLowerCase();
        const category = String(product.category || "");

        return (
          (!search || name.includes(search) || sku.includes(search)) &&
          (!selectedCategory || category === selectedCategory)
        );
      });

      switch (sortProductsEl.value) {
        case "name-desc":
          filtered.sort((a, b) => String(b.name).localeCompare(String(a.name)));
          break;
        case "price-low":
          filtered.sort((a, b) => Number(a.price) - Number(b.price));
          break;
        case "price-high":
          filtered.sort((a, b) => Number(b.price) - Number(a.price));
          break;
        default:
          filtered.sort((a, b) => String(a.name).localeCompare(String(b.name)));
      }

      resultCountEl.textContent = `${filtered.length} products found`;

      if (!filtered.length) {
        productsEl.innerHTML =
          '<div class="empty">Is search/category mein koi product nahi mila.</div>';
        return;
      }

      productsEl.innerHTML = filtered.map(product => `
        <article class="product">
          <div class="product-visual">
            <span class="discount-badge">Best Value</span>
            ${escapeHtml(product.emoji || "📦")}
          </div>

          <div class="product-body">
            <div class="sku">SKU: ${escapeHtml(product.id)}</div>
            <h3>${escapeHtml(product.name)}</h3>
            <div class="rating">★★★★★ <span class="category-text">(4.5)</span></div>
            <div class="category-text">${escapeHtml(product.category || "Other")}</div>
            <div class="price">₹${Number(product.price).toFixed(2)}</div>

            <button
              class="add-btn"
              type="button"
              onclick='addToCartById(${JSON.stringify(product.id)})'
            >
              Add to Cart
            </button>
          </div>
        </article>
      `).join("");
    }

    async function loadProducts() {
      const { data, error } = await db
        .from("products")
        .select("id, name, category, unit, price, active, emoji")
        .eq("active", true);

      if (error) {
        productsEl.innerHTML =
          `<div class="error">Products load nahi hue: ${escapeHtml(error.message)}</div>`;
        return;
      }

      products = data || [];
      fillCategories();
      renderProducts();
    }

    function syncCategory(value) {
      selectedCategory = value;
      topCategoryFilterEl.value = value;
      sideCategoryFilterEl.value = value;

      categoryChipsEl.querySelectorAll(".category-chip").forEach(chip => {
        chip.classList.toggle("active", chip.dataset.category === value);
      });

      renderProducts();
    }

    productSearchEl.addEventListener("input", renderProducts);
    topCategoryFilterEl.addEventListener("change", event => syncCategory(event.target.value));
    sideCategoryFilterEl.addEventListener("change", event => syncCategory(event.target.value));
    sortProductsEl.addEventListener("change", renderProducts);

    window.addToCartById = function(productId) {
      const product = products.find(item => item.id === productId);
      if (!product) return;

      const existing = cart.find(item => item.id === product.id);

      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({
          id: product.id,
          name: product.name,
          price: Number(product.price),
          quantity: 1
        });
      }

      renderCart();
    };

    window.changeQuantity = function(productId, change) {
      const item = cart.find(product => product.id === productId);
      if (!item) return;

      item.quantity += change;

      if (item.quantity <= 0) {
        cart = cart.filter(product => product.id !== productId);
      }

      renderCart();
    };

    window.removeFromCart = function(productId) {
      cart = cart.filter(product => product.id !== productId);
      renderCart();
    };

    function renderCart() {
      const count = cart.reduce((sum, item) => sum + item.quantity, 0);
      const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

      cartCountEl.textContent = count;
      grandTotalEl.textContent = total.toFixed(2);

      if (!cart.length) {
        cartEl.innerHTML = '<div class="empty">Cart empty hai.</div>';
        return;
      }

      cartEl.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div>
            <strong>${escapeHtml(item.name)}</strong>
            <div class="category-text">
              ₹${item.price.toFixed(2)} × ${item.quantity}
            </div>
            <button
              class="remove-btn"
              type="button"
              onclick='removeFromCart(${JSON.stringify(item.id)})'
            >
              Remove
            </button>
          </div>

          <div class="qty-controls">
            <button type="button" onclick='changeQuantity(${JSON.stringify(item.id)}, -1)'>−</button>
            <strong>${item.quantity}</strong>
            <button type="button" onclick='changeQuantity(${JSON.stringify(item.id)}, 1)'>+</button>
          </div>
        </div>
      `).join("");
    }

    document.getElementById("orderForm").addEventListener("submit", async event => {
      event.preventDefault();
      messageEl.className = "message";

      if (!cart.length) {
        showMessage("Pehle cart mein product add karein.", "error");
        return;
      }

      const customerName = document.getElementById("customerName").value.trim();
      const mobile = document.getElementById("mobile").value.trim();
      const address = document.getElementById("address").value.trim();

      if (!customerName || !mobile || !address) {
        showMessage("Customer ki sab details fill karein.", "error");
        return;
      }

      placeOrderBtn.disabled = true;
      placeOrderBtn.textContent = "Order save ho raha hai...";

      const orderCode =
        "ORD-" + Date.now() + "-" + Math.floor(Math.random() * 1000);

      try {
        const { data: order, error: orderError } = await db
          .from("orders")
          .insert({
            order_id: orderCode,
            customer_name: customerName,
            mobile,
            address,
            status: "pending"
          })
          .select("id, order_id")
          .single();

        if (orderError) throw orderError;

        const orderItems = cart.map(item => ({
          order_id: order.id,
          product_id: item.id,
          product_name: item.name,
          quantity: item.quantity,
          price: item.price
        }));

        const { error: itemsError } = await db
          .from("order_items")
          .insert(orderItems);

        if (itemsError) throw itemsError;

        showMessage(
          "Order successfully place ho gaya. Order ID: " + order.order_id,
          "success"
        );

        cart = [];
        renderCart();
        event.target.reset();
      } catch (error) {
        console.error(error);
        showMessage("Order save nahi hua: " + error.message, "error");
      } finally {
        placeOrderBtn.disabled = false;
        placeOrderBtn.textContent = "Place Order";
      }
    });

    renderCart();
    loadProducts();
  </script>
</body>
</html>
