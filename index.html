<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Apna DG Store</title>

  <style>
    :root {
      --navy: #0f172a;
      --navy-2: #1e293b;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --yellow: #f59e0b;
      --green: #16a34a;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #111827;
      --muted: #64748b;
      --danger: #dc2626;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    button, input, select, textarea { font: inherit; }

    /* Header */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--navy);
      color: white;
      box-shadow: 0 3px 14px rgba(0,0,0,.2);
    }

    .top-row {
      width: min(1440px, 96%);
      margin: auto;
      min-height: 70px;
      display: grid;
      grid-template-columns: auto minmax(200px, 1fr) auto;
      gap: 14px;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      cursor: pointer;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #f59e0b, #f97316);
      font-size: 23px;
    }

    .brand h1 { margin: 0; font-size: 22px; }
    .brand small { display: block; color: #cbd5e1; font-size: 11px; }

    .search-wrap {
      display: grid;
      grid-template-columns: 130px 1fr 50px;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    .search-wrap select,
    .search-wrap input {
      border: 0;
      outline: 0;
      min-height: 44px;
      background: white;
    }

    .search-wrap select {
      padding: 0 10px;
      border-right: 1px solid var(--border);
      color: #334155;
    }

    .search-wrap input { padding: 0 12px; min-width: 0; }

    .search-btn {
      border: 0;
      cursor: pointer;
      background: var(--yellow);
      font-size: 18px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .account-button {
      background: transparent;
      border: 0;
      color: white;
      cursor: pointer;
      text-align: left;
      font-size: 12px;
      line-height: 1.2;
    }

    .account-button strong {
      display: block;
      font-size: 14px;
      color: var(--yellow);
    }

    .cart-button {
      border: 0;
      cursor: pointer;
      border-radius: 10px;
      padding: 10px 16px;
      background: #fff;
      color: var(--navy);
      font-weight: 800;
      white-space: nowrap;
    }

    /* Layout */
    .store-content {
      width: min(1440px, 96%);
      margin: 18px auto 50px;
      display: grid;
      grid-template-columns: 90px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .category-rail {
      position: sticky;
      top: 85px;
      max-height: calc(100vh - 100px);
      overflow-y: auto;
      padding: 8px 4px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
      scrollbar-width: thin;
    }

    .category-rail-button {
      width: 100%;
      border: 0;
      background: transparent;
      cursor: pointer;
      padding: 6px 2px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.2;
      text-align: center;
      position: relative;
    }

    .category-rail-button:hover { background: #f8fafc; color: var(--text); }

    .category-rail-button.active {
      background: #fff7ed;
      color: #111827;
      font-weight: 800;
    }

    .category-rail-button.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 6px;
      bottom: 6px;
      width: 4px;
      border-radius: 0 4px 4px 0;
      background: var(--yellow);
    }

    .category-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 22px;
      background: linear-gradient(135deg, #eff6ff, #fff7ed);
      border: 1px solid #e2e8f0;
    }

    .catalog-area { min-width: 0; }

    .card {
      background: var(--surface);
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .catalog-controls {
      padding: 14px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .catalog-heading { flex: 1; min-width: 160px; }
    .catalog-heading h2 { margin: 0; font-size: 20px; }
    .catalog-heading span { color: var(--muted); font-size: 13px; }

    .catalog-controls select {
      min-height: 40px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 10px;
      background: white;
      outline: 0;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .product {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 330px;
    }

    .product-visual {
      min-height: 140px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #eff6ff, #fff7ed);
      font-size: 50px;
    }

    .product-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .product h3 { margin: 0; font-size: 15px; min-height: 38px; }
    .price { margin-top: auto; font-size: 18px; font-weight: 900; }

    .add-btn {
      width: 100%;
      border: 0;
      cursor: pointer;
      border-radius: 8px;
      padding: 10px;
      background: var(--yellow);
      color: #111827;
      font-weight: 800;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.5);
      z-index: 100;
      display: none;
      justify-content: flex-end;
      backdrop-filter: blur(2px);
    }

    .modal-overlay.open { display: flex; }

    .modal-panel {
      width: 100%;
      max-width: 440px;
      height: 100%;
      background: white;
      padding: 20px;
      overflow-y: auto;
      box-shadow: -4px 0 20px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      animation: slideIn 0.25s ease-out;
    }

    @keyframes slideIn {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h2 { margin: 0; font-size: 20px; }

    .close-btn {
      border: 0;
      background: #f1f5f9;
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      font-weight: 800;
      color: var(--muted);
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .qty-controls button {
      width: 26px;
      height: 26px;
      border: 0;
      cursor: pointer;
      border-radius: 6px;
      background: #e2e8f0;
      font-weight: 800;
    }

    .total {
      display: flex;
      justify-content: space-between;
      margin: 16px 0;
      padding-top: 12px;
      border-top: 2px solid var(--border);
      font-size: 18px;
      font-weight: 900;
    }

    .form-grid { display: grid; gap: 10px; }

    .form-grid input, .form-grid textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      outline: 0;
    }

    .place-btn, .action-btn {
      width: 100%;
      margin-top: 10px;
      border: 0;
      cursor: pointer;
      border-radius: 8px;
      padding: 12px;
      color: white;
      background: var(--blue);
      font-weight: 800;
    }

    /* Order History Styling */
    .order-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .order-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 13px;
    }

    .order-status {
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      text-transform: uppercase;
      background: #fef3c7;
      color: #92400e;
      font-weight: 800;
    }

    .order-status.completed { background: #dcfce7; color: #166534; }

    .order-details-body {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
    }

    .order-item-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #334155;
      padding: 4px 0;
    }

    .order-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-weight: 800;
      font-size: 15px;
    }

    .empty, .loading {
      padding: 30px;
      text-align: center;
      color: var(--muted);
      background: white;
      border-radius: 14px;
    }

    .back-categories-btn {
      border: 0;
      background: var(--navy);
      color: white;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 800;
    }

    .category-landing {
      width: min(1200px, 94%);
      margin: 24px auto 50px;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 14px;
    }

    .category-card {
      border: 1px solid var(--border);
      background: white;
      border-radius: 16px;
      padding: 16px 8px;
      cursor: pointer;
      display: grid;
      place-items: center;
      gap: 6px;
      text-align: center;
      font-weight: 800;
    }

    @media (max-width: 650px) {
      .store-content {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .category-rail {
        position: static;
        width: 100%;
        max-height: none;
        flex-direction: row;
        overflow-x: auto;
        padding: 8px;
        border-radius: 12px;
      }

      .category-rail-button { flex: 0 0 70px; }
    }
  </style>
</head>

<body>
  <header class="top-header">
    <div class="top-row">
      <div id="brandHome" class="brand">
        <div class="brand-logo">🛒</div>
        <div>
          <h1>Apna DG Store</h1>
          <small>Sab kuch, ek jagah</small>
        </div>
      </div>

      <div class="search-wrap">
        <select id="topCategoryFilter"><option value="">All</option></select>
        <input id="productSearch" type="search" placeholder="Search products..." />
        <button class="search-btn" type="button">🔍</button>
      </div>

      <div class="header-actions">
        <button id="accountToggleBtn" class="account-button" type="button">
          Hello, Customer
          <strong>Your Orders</strong>
        </button>

        <button id="cartToggleBtn" class="cart-button" type="button">
          🛍 Cart <span id="cartCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <section id="categoryLanding" class="category-landing">
    <h2>Shop by Category</h2>
    <div id="categoryLandingGrid" class="category-grid"></div>
  </section>

  <main id="productsArea" class="store-content" style="display:none;">
    <aside id="categoryRail" class="category-rail"></aside>

    <section class="catalog-area">
      <div class="card catalog-controls">
        <button id="backToCategoriesBtn" class="back-categories-btn" type="button">← Categories</button>
        <div class="catalog-heading">
          <h2 id="activeCategoryTitle">All Products</h2>
          <span id="resultCount"></span>
        </div>
        <select id="sideCategoryFilter"><option value="">All Categories</option></select>
        <select id="sortProducts">
          <option value="name-asc">Name: A to Z</option>
          <option value="name-desc">Name: Z to A</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
        </select>
      </div>

      <div id="products" class="products">
        <div class="loading">Products load ho rahe hain...</div>
      </div>
    </section>
  </main>

  <div id="cartOverlay" class="modal-overlay">
    <aside class="modal-panel">
      <div class="modal-header">
        <h2>Your Cart</h2>
        <button id="closeCartBtn" class="close-btn" type="button">✕</button>
      </div>

      <div id="cart"></div>

      <div class="total">
        <span>Total</span>
        <span>₹<span id="grandTotal">0.00</span></span>
      </div>

      <h3>Customer Details</h3>
      <form id="orderForm">
        <div class="form-grid">
          <input id="customerName" type="text" placeholder="Customer name" required />
          <input id="mobile" type="tel" placeholder="Mobile number" minlength="10" maxlength="10" required />
          <textarea id="address" placeholder="Delivery address" required></textarea>
        </div>

        <button id="placeOrderBtn" class="place-btn" type="submit">
          Place Order
        </button>
      </form>
    </aside>
  </div>

  <div id="accountOverlay" class="modal-overlay">
    <aside class="modal-panel">
      <div class="modal-header">
        <h2>My Account & Orders</h2>
        <button id="closeAccountBtn" class="close-btn" type="button">✕</button>
      </div>

      <div class="form-grid" style="margin-bottom: 16px;">
        <label style="font-size: 12px; font-weight: 700; color: var(--muted);">Mobile Number se purane orders dekhein:</label>
        <div style="display:flex; gap:8px;">
          <input id="accountMobileInput" type="tel" placeholder="Mobile number enter karein" />
          <button id="fetchOrdersBtn" class="action-btn" type="button" style="margin:0; width: 100px;">Search</button>
        </div>
      </div>

      <div id="orderHistoryContainer">
        <div class="empty">Mobile number dalkar "Search" dabaen.</div>
      </div>
    </aside>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://xbzvnhhyataeciiysbhh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_aevPjOJgExRRlhUA9-iAYg_tpIk03it";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let products = [];
    let cart = [];
    let selectedCategory = "";

    const productsEl = document.getElementById("products");
    const productSearchEl = document.getElementById("productSearch");
    const topCategoryFilterEl = document.getElementById("topCategoryFilter");
    const sideCategoryFilterEl = document.getElementById("sideCategoryFilter");
    const sortProductsEl = document.getElementById("sortProducts");
    const categoryRailEl = document.getElementById("categoryRail");
    const activeCategoryTitleEl = document.getElementById("activeCategoryTitle");
    const categoryLandingEl = document.getElementById("categoryLanding");
    const categoryLandingGridEl = document.getElementById("categoryLandingGrid");
    const productsAreaEl = document.getElementById("productsArea");
    const backToCategoriesBtn = document.getElementById("backToCategoriesBtn");
    const resultCountEl = document.getElementById("resultCount");
    
    const cartOverlayEl = document.getElementById("cartOverlay");
    const cartToggleBtn = document.getElementById("cartToggleBtn");
    const closeCartBtn = document.getElementById("closeCartBtn");
    const cartEl = document.getElementById("cart");
    const cartCountEl = document.getElementById("cartCount");
    const grandTotalEl = document.getElementById("grandTotal");

    const accountOverlayEl = document.getElementById("accountOverlay");
    const accountToggleBtn = document.getElementById("accountToggleBtn");
    const closeAccountBtn = document.getElementById("closeAccountBtn");
    const accountMobileInput = document.getElementById("accountMobileInput");
    const fetchOrdersBtn = document.getElementById("fetchOrdersBtn");
    const orderHistoryContainer = document.getElementById("orderHistoryContainer");

    cartToggleBtn.addEventListener("click", () => cartOverlayEl.classList.add("open"));
    closeCartBtn.addEventListener("click", () => cartOverlayEl.classList.remove("open"));
    cartOverlayEl.addEventListener("click", (e) => { if (e.target === cartOverlayEl) cartOverlayEl.classList.remove("open"); });

    accountToggleBtn.addEventListener("click", () => accountOverlayEl.classList.add("open"));
    closeAccountBtn.addEventListener("click", () => accountOverlayEl.classList.remove("open"));
    accountOverlayEl.addEventListener("click", (e) => { if (e.target === accountOverlayEl) accountOverlayEl.classList.remove("open"); });

    function categoryEmoji(cat) {
      const icons = {
        "biscuits & snacks": "🍪", "dairy products": "🥛",
        "flour & staples": "🌾", "fruits": "🍎",
        "home care": "🧹", "rice & grains": "🍚"
      };
      return icons[(cat || "").toLowerCase()] || "📦";
    }

    function fillCategories() {
      const categories = [...new Set(products.map(p => p.category).filter(Boolean))].sort();

      topCategoryFilterEl.innerHTML = '<option value="">All</option>' + 
        categories.map(c => `<option value="${c}">${c}</option>`).join("");

      sideCategoryFilterEl.innerHTML = '<option value="">All Categories</option>' + 
        categories.map(c => `<option value="${c}">${c}</option>`).join("");

      categoryRailEl.innerHTML = `
        <button class="category-rail-button active" data-category="">
          <span class="category-icon">🛒</span><span>All</span>
        </button>` +
        categories.map(c => `
          <button class="category-rail-button" data-category="${c}">
            <span class="category-icon">${categoryEmoji(c)}</span><span>${c}</span>
          </button>`).join("");

      categoryLandingGridEl.innerHTML = categories.map(c => `
        <button class="category-card" type="button" data-category="${c}">
          <span class="category-icon">${categoryEmoji(c)}</span><span>${c}</span>
        </button>`).join("");

      document.querySelectorAll("[data-category]").forEach(btn => {
        btn.addEventListener("click", () => syncCategory(btn.dataset.category || ""));
      });
    }

    function renderProducts() {
      const search = productSearchEl.value.trim().toLowerCase();
      let filtered = products.filter(p => {
        const matchSearch = !search || p.name.toLowerCase().includes(search) || String(p.id).toLowerCase().includes(search);
        const matchCat = !selectedCategory || p.category === selectedCategory;
        return matchSearch && matchCat;
      });

      resultCountEl.textContent = `${filtered.length} products found`;
      activeCategoryTitleEl.textContent = selectedCategory || "All Products";

      if (!filtered.length) {
        productsEl.innerHTML = '<div class="empty">Koi product nahi mila.</div>';
        return;
      }

      productsEl.innerHTML = filtered.map(p => `
        <article class="product">
          <div class="product-visual">${p.emoji || "📦"}</div>
          <div class="product-body">
            <h3>${p.name}</h3>
            <div class="price">₹${Number(p.price).toFixed(2)}</div>
            <button class="add-btn" onclick='addToCartById("${p.id}")'>Add to Cart</button>
          </div>
        </article>
      `).join("");
    }

    async function loadProducts() {
      const { data } = await db.from("products").select("*").eq("active", true);
      products = data || [];
      fillCategories();
      renderProducts();
    }

    function syncCategory(val) {
      selectedCategory = val;
      topCategoryFilterEl.value = val;
      sideCategoryFilterEl.value = val;
      document.querySelectorAll(".category-rail-button").forEach(b => {
        b.classList.toggle("active", b.dataset.category === selectedCategory);
      });
      categoryLandingEl.style.display = "none";
      productsAreaEl.style.display = "grid";
      renderProducts();
    }

    window.addToCartById = function(id) {
      const p = products.find(x => x.id === id);
      if (!p) return;
      const exist = cart.find(x => x.id === id);
      if (exist) exist.quantity++;
      else cart.push({ id: p.id, name: p.name, price: Number(p.price), quantity: 1 });
      renderCart();
    };

    window.changeQuantity = function(id, chg) {
      const item = cart.find(x => x.id === id);
      if (item) {
        item.quantity += chg;
        if (item.quantity <= 0) cart = cart.filter(x => x.id !== id);
      }
      renderCart();
    };

    function renderCart() {
      cartCountEl.textContent = cart.reduce((s, i) => s + i.quantity, 0);
      grandTotalEl.textContent = cart.reduce((s, i) => s + i.price * i.quantity, 0).toFixed(2);

      if (!cart.length) {
        cartEl.innerHTML = '<div class="empty">Cart khali hai.</div>';
        return;
      }

      cartEl.innerHTML = cart.map(i => `
        <div class="cart-item">
          <div>
            <strong>${i.name}</strong>
            <div>₹${i.price} × ${i.quantity}</div>
          </div>
          <div class="qty-controls">
            <button onclick='changeQuantity("${i.id}", -1)'>-</button>
            <span>${i.quantity}</span>
            <button onclick='changeQuantity("${i.id}", 1)'>+</button>
          </div>
        </div>
      `).join("");
    }

    /* Fixed Order Saving */
    document.getElementById("orderForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!cart.length) return alert("Pehle cart mein items add karein.");

      const customerName = document.getElementById("customerName").value.trim();
      const rawMobile = document.getElementById("mobile").value.trim();
      const mobile = rawMobile.replace(/\D/g, "");
      const address = document.getElementById("address").value.trim();
      const placeOrderBtn = document.getElementById("placeOrderBtn");

      placeOrderBtn.disabled = true;
      placeOrderBtn.textContent = "Order Ho Raha Hai...";

      const orderCode = "ORD-" + Date.now() + "-" + Math.floor(Math.random() * 1000);

      try {
        const { data: order, error: orderErr } = await db
          .from("orders")
          .insert({ order_id: orderCode, customer_name: customerName, mobile: mobile, address: address, status: "pending" })
          .select("id, order_id")
          .single();

        if (orderErr) throw orderErr;

        const orderItems = cart.map(item => ({
          order_id: order.id,
          product_id: String(item.id),
          product_name: item.name,
          quantity: item.quantity,
          price: item.price
        }));

        const { error: itemsErr } = await db.from("order_items").insert(orderItems);
        if (itemsErr) throw itemsErr;

        alert("Order Successful! Order ID: " + order.order_id);
        cart = [];
        renderCart();
        e.target.reset();
        cartOverlayEl.classList.remove("open");
      } catch (err) {
        alert("Order fail ho gaya: " + err.message);
      } finally {
        placeOrderBtn.disabled = false;
        placeOrderBtn.textContent = "Place Order";
      }
    });

    /* SPECIFIC CONSTRAINT BASED FETCH FIX */
    fetchOrdersBtn.addEventListener("click", async () => {
      const rawMobile = accountMobileInput.value.trim();
      if (!rawMobile) return alert("Mobile number enter karein.");

      const mobileClean = rawMobile.replace(/\D/g, "");
      const mobileWithZero = "0" + mobileClean;

      orderHistoryContainer.innerHTML = '<div class="loading">Orders search ho rahe hain...</div>';

      try {
        const { data: orders, error: orderErr } = await db
          .from("orders")
          .select("*, order_items!fk_orders(*)")
          .or(`mobile.eq.${mobileClean},mobile.eq.${mobileWithZero}`)
          .order("created_at", { ascending: false });

        if (orderErr) throw orderErr;

        if (!orders || orders.length === 0) {
          orderHistoryContainer.innerHTML = '<div class="empty">Is mobile number par koi order nahi mila.</div>';
          return;
        }

        orderHistoryContainer.innerHTML = orders.map(order => {
          let items = order.order_items || [];

          let totalCalculated = items.reduce((sum, item) => {
            let price = Number(item.price || 0);
            let qty = Number(item.quantity || 1);

            if (price === 0 && item.product_id) {
              const matchedProd = products.find(p => String(p.id) === String(item.product_id));
              if (matchedProd) price = Number(matchedProd.price || 0);
            }
            return sum + (price * qty);
          }, 0);

          const dateStr = order.created_at ? new Date(order.created_at).toLocaleDateString("hi-IN") : "N/A";

          return `
            <div class="order-card">
              <div class="order-card-header">
                <span>ID: ${order.order_id || ('#' + order.id)}</span>
                <span class="order-status ${order.status || 'pending'}">${order.status || 'Pending'}</span>
              </div>
              <div style="font-size:11px; color:var(--muted); margin-top:4px;">Date: ${dateStr}</div>
              
              <div class="order-details-body">
                <div style="font-size:12px; font-weight:700; margin-bottom:6px; color:var(--navy);">Purchased Items:</div>
                ${items.length > 0 
                  ? items.map(it => {
                      let itemPrice = Number(it.price || 0);
                      if (itemPrice === 0 && it.product_id) {
                        const mp = products.find(p => String(p.id) === String(it.product_id));
                        if (mp) itemPrice = Number(mp.price || 0);
                      }
                      return `
                        <div class="order-item-row">
                          <span>• ${it.product_name || 'Item'} (×${it.quantity || 1})</span>
                          <span>₹${(itemPrice * Number(it.quantity || 1)).toFixed(2)}</span>
                        </div>
                      `;
                    }).join('')
                  : '<div style="font-size:12px; color:var(--muted);">No item details in DB</div>'
                }
              </div>

              <div class="order-footer">
                <span>Total Amount:</span>
                <span style="color:var(--navy);">₹${totalCalculated.toFixed(2)}</span>
              </div>
            </div>
          `;
        }).join("");

      } catch (err) {
        console.error(err);
        orderHistoryContainer.innerHTML = '<div class="empty">Error: ' + err.message + '</div>';
      }
    });

    backToCategoriesBtn.addEventListener("click", () => {
      selectedCategory = "";
      productsAreaEl.style.display = "none";
      categoryLandingEl.style.display = "";
    });

    document.getElementById("brandHome").addEventListener("click", () => {
      selectedCategory = "";
      productsAreaEl.style.display = "none";
      categoryLandingEl.style.display = "";
    });

    renderCart();
    loadProducts();
  </script>
</body>
</html>
