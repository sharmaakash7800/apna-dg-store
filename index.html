<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apna DG Store</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }
    header {
      background: #15803d;
      color: white;
      padding: 18px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { margin: 0; font-size: 24px; }
    .cart-count {
      background: white;
      color: #15803d;
      padding: 8px 12px;
      border-radius: 20px;
      font-weight: bold;
    }
    main {
      width: min(1180px, 92%);
      margin: 28px auto;
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      gap: 24px;
    }
    .panel {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 5px 18px rgba(0,0,0,.08);
    }
    h2 { margin-top: 0; }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 16px;
    }
    .product {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .emoji { font-size: 42px; }
    .product h3 { margin: 0; }
    .muted { color: #6b7280; font-size: 14px; }
    .price { font-size: 19px; font-weight: bold; color: #15803d; }
    button {
      border: 0;
      border-radius: 9px;
      padding: 11px 14px;
      cursor: pointer;
      font-weight: bold;
    }
    .add-btn, .submit-btn {
      background: #16a34a;
      color: white;
    }
    .add-btn:hover, .submit-btn:hover { background: #15803d; }
    .submit-btn { width: 100%; margin-top: 12px; font-size: 16px; }
    .submit-btn:disabled { opacity: .65; cursor: not-allowed; }
    .cart-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 12px 0;
      border-bottom: 1px solid #e5e7eb;
    }
    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .qty-controls button {
      width: 30px;
      height: 30px;
      padding: 0;
      background: #e5e7eb;
    }
    .remove-btn {
      background: transparent;
      color: #dc2626;
      padding: 4px;
    }
    .total {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: bold;
      margin: 18px 0;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 15px;
    }
    textarea { min-height: 90px; resize: vertical; }
    .message {
      margin-top: 14px;
      padding: 12px;
      border-radius: 9px;
      display: none;
    }
    .success { display: block; background: #dcfce7; color: #166534; }
    .error { display: block; background: #fee2e2; color: #991b1b; }
    .empty { color: #6b7280; text-align: center; padding: 18px; }
    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🛒 Apna DG Store</h1>
    <div class="cart-count">Cart: <span id="cartCount">0</span></div>
  </header>

  <main>
    <section class="panel">
      <h2>Products</h2>
      <div id="products" class="products">
        <p>Products load ho rahe hain...</p>
      </div>
    </section>

    <aside class="panel">
      <h2>Your Cart</h2>
      <div id="cart"></div>
      <div class="total">
        <span>Total</span>
        <span>₹<span id="grandTotal">0</span></span>
      </div>

      <h2>Customer Details</h2>
      <form id="orderForm">
        <input id="customerName" type="text" placeholder="Customer name" required />
        <input id="mobile" type="tel" placeholder="Mobile number" minlength="10" required />
        <textarea id="address" placeholder="Delivery address" required></textarea>
        <button id="placeOrderBtn" class="submit-btn" type="submit">Place Order</button>
      </form>
      <div id="message" class="message"></div>
    </aside>
  </main>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    // Supabase Dashboard → Project Settings → API se values copy karein.
    const SUPABASE_URL = "PASTE_YOUR_SUPABASE_URL_HERE";
    const SUPABASE_ANON_KEY = "PASTE_YOUR_ANON_OR_PUBLISHABLE_KEY_HERE";

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let products = [];
    let cart = [];

    const productsEl = document.getElementById("products");
    const cartEl = document.getElementById("cart");
    const cartCountEl = document.getElementById("cartCount");
    const grandTotalEl = document.getElementById("grandTotal");
    const messageEl = document.getElementById("message");
    const placeOrderBtn = document.getElementById("placeOrderBtn");

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = "message " + type;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function loadProducts() {
      const { data, error } = await db
        .from("products")
        .select("id, name, category, unit, price, active, emoji")
        .eq("active", true)
        .order("name");

      if (error) {
        productsEl.innerHTML =
          '<p class="error">Products load nahi hue: ' + escapeHtml(error.message) + "</p>";
        return;
      }

      products = data || [];

      if (!products.length) {
        productsEl.innerHTML = '<p class="empty">Koi active product nahi mila.</p>';
        return;
      }

      productsEl.innerHTML = products.map((p, index) => `
        <article class="product">
          <div class="emoji">${escapeHtml(p.emoji || "📦")}</div>
          <h3>${escapeHtml(p.name)}</h3>
          <div class="muted">${escapeHtml(p.category || "")}</div>
          <div class="muted">${escapeHtml(p.unit || "")}</div>
          <div class="price">₹${Number(p.price).toFixed(2)}</div>
          <button class="add-btn" type="button" onclick="addToCart(${index})">
            Add to Cart
          </button>
        </article>
      `).join("");
    }

    window.addToCart = function(index) {
      const product = products[index];
      const existing = cart.find(item => item.id === product.id);

      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({
          id: product.id,
          name: product.name,
          price: Number(product.price),
          quantity: 1
        });
      }

      renderCart();
    };

    window.changeQuantity = function(productId, change) {
      const item = cart.find(p => p.id === productId);
      if (!item) return;

      item.quantity += change;
      if (item.quantity <= 0) {
        cart = cart.filter(p => p.id !== productId);
      }
      renderCart();
    };

    window.removeFromCart = function(productId) {
      cart = cart.filter(p => p.id !== productId);
      renderCart();
    };

    function renderCart() {
      const count = cart.reduce((sum, item) => sum + item.quantity, 0);
      const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

      cartCountEl.textContent = count;
      grandTotalEl.textContent = total.toFixed(2);

      if (!cart.length) {
        cartEl.innerHTML = '<p class="empty">Cart empty hai.</p>';
        return;
      }

      cartEl.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div>
            <strong>${escapeHtml(item.name)}</strong>
            <div class="muted">₹${item.price.toFixed(2)} × ${item.quantity}</div>
            <button class="remove-btn" type="button"
              onclick='removeFromCart(${JSON.stringify(item.id)})'>Remove</button>
          </div>
          <div class="qty-controls">
            <button type="button" onclick='changeQuantity(${JSON.stringify(item.id)}, -1)'>−</button>
            <span>${item.quantity}</span>
            <button type="button" onclick='changeQuantity(${JSON.stringify(item.id)}, 1)'>+</button>
          </div>
        </div>
      `).join("");
    }

    document.getElementById("orderForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      messageEl.className = "message";

      if (!cart.length) {
        showMessage("Pehle cart mein product add karein.", "error");
        return;
      }

      const customerName = document.getElementById("customerName").value.trim();
      const mobile = document.getElementById("mobile").value.trim();
      const address = document.getElementById("address").value.trim();

      if (!customerName || !mobile || !address) {
        showMessage("Customer ki sab details fill karein.", "error");
        return;
      }

      placeOrderBtn.disabled = true;
      placeOrderBtn.textContent = "Order save ho raha hai...";

      // Date + random value se har order ki unique ID.
      const orderCode =
        "ORD-" + Date.now() + "-" + Math.floor(Math.random() * 1000);

      try {
        // 1) Main order save karein aur generated numeric id lein.
        const { data: order, error: orderError } = await db
          .from("orders")
          .insert({
            order_id: orderCode,
            customer_name: customerName,
            mobile,
            address,
            status: "pending"
          })
          .select("id, order_id")
          .single();

        if (orderError) throw orderError;

        // 2) Ek hi order ke saare products order_items mein save karein.
        const orderItems = cart.map(item => ({
          order_id: order.id,
          product_id: item.id,
          product_name: item.name,
          quantity: item.quantity,
          price: item.price
        }));

        const { error: itemsError } = await db
          .from("order_items")
          .insert(orderItems);

        if (itemsError) throw itemsError;

        showMessage(
          "Order successfully place ho gaya. Order ID: " + order.order_id,
          "success"
        );

        cart = [];
        renderCart();
        event.target.reset();
      } catch (error) {
        console.error(error);
        showMessage("Order save nahi hua: " + error.message, "error");
      } finally {
        placeOrderBtn.disabled = false;
        placeOrderBtn.textContent = "Place Order";
      }
    });

    renderCart();
    loadProducts();
  </script>
</body>
</html>
